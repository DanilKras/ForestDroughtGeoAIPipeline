[project]
name = "canopy_drought_vulnerability_probability"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "apache-airflow>=3.3.2",
    "dask>=2026.8.0",
    "duckdb>=1.5.5",
    "dvc>=3.67.1",
    "folium>=0.20.0",
    "fsspec>=2026.7.0",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.3.5",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "planetary-computer>=1.0.0",
    "plotly>=7.1.0",
    "pygbif>=0.6.6",
    "pystac-client>=0.9.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.1",
    "rasterstats>=0.21.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "scipy-stubs~=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "shapely>=2.1.2",
    "spatial-kfold>=0.0.4",
    "streamlit>=1.64.0",
    "streamlit-folium>=0.27.4",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "xarray>=2026.7.0",
    "xgboost>=3.4.1",
    "zarr>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    ".dvc",
    "logs",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"dags/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
    "logs",
    ".venv",
    "venv",
    "data",
    ".dvc",
    ".git"
]
