project:
  name: "Forest_Drought_Vulnerability_GeoAI"
  target_phenomenon: "Canopy_Dieback_and_Drought_Vulnerability"
  region_name: "Sopron_Fertő_Ecosystem"
  macro_target_column: "target"

paths:
  raw_data: "data/01_raw/forest_dieback_europe.parquet"
  clean_gpkg: "data/02_processed/forest_dieback_clean.gpkg"
  features_combined: "data/02_processed/features_combined.csv"
  features_terrain_checkpoint: "data/02_processed/features_terrain_checkpoint.parquet"
  features_advanced: "data/02_processed/features_advanced.parquet"

  model_weights: "models/forest_vulnerability_xgb.json"
  risk_map_tif: "data/03_results/maps/regional_vulnerability_map.tif"
  feature_stack_tif: "data/03_results/maps/regional_features_stack.tif"
  shap_summary_plot: "data/03_results/figures/spatial_shap_summary.png"
  eda_distribution_plot: "data/03_results/figures/clean_presence_distribution.png"

features:
  columns:
    - "elevation"
    - "slope_deg"
    - "northness_aspect"
    - "twi_moisture_index"
    - "landcover_class"
    - "bio1_mean_temp"
    - "bio4_temp_seasonality"
    - "bio12_annual_precip"
    - "bio15_precip_seasonality"
    - "soil_ph"
    - "soil_clay_percent"

spatial:
  bbox: [16.45, 47.55, 16.70, 47.75]
  crs_wgs84: "EPSG:4326"
  crs_projected: "EPSG:3035"
  block_size_meters: 150000

cv_params:
  n_splits: 5

model_params:
  n_estimators: 250
  learning_rate: 0.03
  max_depth: 4
  subsample: 0.7
  colsample_bytree: 0.5
  reg_lambda: 3.0
  random_state: 42
  eval_metric: "auc"

temporal:
  start_date: "1995-01-01"
  end_date: "2025-12-31"

climate:
  variables: ["tmax", "tmin", "ppt"]

sentinel2:
  max_cloud_cover: 20
  bands: ["B04", "B08", "B11", "SCL"]

data_source:
  type: "local"
  local_path: "data/01_raw/EUForestspecies.csv"
  target_records: 70000

pseudo_absences:
  min_dist_meters: 5000
  max_extent_buffer_m: 200000

micro:
  paths:
    raw_micro_dir: "micro_soe"
    points_shp: "data/micro_soe/soe_rede_CrownPoints.shp"
    forest_units_shp: "data/micro_soe/ForestUnits.shp"
    ddm_tif: "data/micro_soe/lidar/DDM_1m_EOV.tif"
    dfm_tif: "data/micro_soe/lidar/DFM_1m_EOV.tif"
    ortho_tif: "data/micro_soe/lidar/ortofoto_20cm_EOV.tif"
    chm_tif: "data/02_processed/CHM_1m_EOV.tif"
    annotated_crowns_gpkg: "data/02_processed/annotated_crowns.gpkg"

  sentinel:
    collection_s2: "sentinel-2-l2a"
    collection_s1: "sentinel-1-rtc"
    date_range: "2024-05-01/2024-09-30"
    max_cloud_cover: 20
    target_resolution_m: 10.0
    output_composite: "data/02_processed/sentinel_rede_composite_10m.tif"

  training:
    batch_size: 64
    epochs: 20
    learning_rate: 0.0003
    weight_decay: 0.0001
    embed_dim: 128
    num_heads: 4
    vit_depth: 4
    patch_size: 4
    micro_size_px: 32
    meso_size_px: 5
    meso_window_m: 50.0